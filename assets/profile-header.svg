<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-labelledby="title desc">
  <title id="title">Philip Hellerup</title>
  <desc id="desc">GitHub profile header</desc>

  <style>
    .name,
    .line {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      fill: #1f2328;
    }

    .name {
      font-size: 58px;
      font-weight: 700;
      letter-spacing: -1.2px;
    }

    .line {
      font-size: 23px;
      font-weight: 400;
    }

    @media (prefers-color-scheme: dark) {
      .name,
      .line {
        fill: #f0f6fc;
      }
    }
  </style>

  <text class="name" x="450" y="58" text-anchor="middle">Philip Hellerup</text>
  <text class="line" x="450" y="104" text-anchor="middle">Software Engineering Student at Aalborg University</text>
  <text class="line" x="450" y="136" text-anchor="middle">Registered Scrum Master</text>
</svg>
